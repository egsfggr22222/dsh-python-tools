# Python Tools bundle patch.
#
# One insert mounts the Host half: the registry of installed Python tool files,
# their location watcher, the subprocess bridge that runs them, the tools and
# skills they declare, and the `pytools` tool that installs/inspects/calls them.
# The plugin owns no capability of its own — every tool it exposes belongs to a
# Python file the user (or an agent) pointed it at.
- insert:
    - id: dsh-python-tools
      name: 'dsh-python-tools'
      config: {}
